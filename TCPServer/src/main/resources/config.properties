# Network configuration of the chat server.
# Edit this file (or put a copy next to TCPServer.jar) to change the settings
# WITHOUT recompiling the code.

# 0.0.0.0 = listen on ALL network interfaces (Wi-Fi, Ethernet, localhost)
# use 127.0.0.1 to accept connections from this machine only
server.ip=0.0.0.0
server.port=3000
